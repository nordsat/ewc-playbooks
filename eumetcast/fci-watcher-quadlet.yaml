---
- name: Setup Rootless Pytroll Stack
  hosts: all
  vars_files:
    - vars.yaml

  tasks:
    - name: Check if user lingering is enabled
      ansible.builtin.stat:
        path: "/var/lib/systemd/linger/{{ ansible_user_id }}"
      register: user_lingering

    - name: Enable lingering for service user
      become: true
      ansible.builtin.command:
        cmd: "loginctl enable-linger {{ ansible_user_id }}"
      changed_when: false

    - name: Install the latest version of podman
      package:
        name: podman
        state: latest
      become: true
      when: (ignore_packages is not defined or not (ignore_packages | bool))

    - name: show podman version
      shell: podman --version
      register: podman_version
      changed_when: false

    # Quadlets need podman >= 4.4 (Ubuntu 24.04 has 4.9). Older podman, as on the
    # Ubuntu 22.04 EUMETCast host (3.4), gets a plain systemd user unit instead.
    - name: Decide between quadlets and plain systemd units
      ansible.builtin.set_fact:
        use_quadlets: "{{ podman_version.stdout.split()[-1] is version('4.4', '>=') }}"

    - name: bug fix for ubuntu 22 https://bugs.launchpad.net/ubuntu/+source/libpod/+bug/2024394
      become: true
      shell: curl -O http://archive.ubuntu.com/ubuntu/pool/universe/g/golang-github-containernetworking-plugins/containernetworking-plugins_1.1.1+ds1-3build1_amd64.deb
      when: ansible_distribution == 'Ubuntu' and ansible_distribution_version == '22.04'

    - name: bug fix for ubuntu 22 https://bugs.launchpad.net/ubuntu/+source/libpod/+bug/2024394 part 2
      become: true
      shell: dpkg -i containernetworking-plugins_1.1.1+ds1-3build1_amd64.deb
      when: ansible_distribution == 'Ubuntu' and ansible_distribution_version == '22.04'

    - name: Install the latest version of aardvark-dns
      package:
        name: aardvark-dns
        state: latest
      become: true
      when: ansible_distribution == 'Ubuntu' and ansible_distribution_version >= '24.04'

    - name: Install the latest version of uidmap
      package:
        name: uidmap
        state: latest
      become: true
      when: (ignore_packages is not defined or not (ignore_packages | bool)) and (ansible_distribution == 'Ubuntu' and ansible_distribution_version >= '22.04')

    - name: Install the latest version of slirp4netns
      package:
        name: slirp4netns
        state: latest
      become: true
      when: (ignore_packages is not defined or not (ignore_packages | bool))

    - name: Get UID of the become user
      ansible.builtin.command: id -u
      register: user_id_result
      changed_when: false

    - name: Update the configuration files
      git:
        repo: "{{ config_repo }}"
        dest: "{{ install_dir }}"
      register: git_config_results
      failed_when:
        - git_config_results.failed
        - not 'Local modifications exist in repository' in git_config_results.msg

    # - name: copy the environment configuration
    #   copy:
    #     src: env-variables
    #     dest: "{{ install_dir }}/config_sar_grd"
    #   register: environment_config_results

    # - name: Ensure output directory exists
    #   ansible.builtin.file:
    #     path: "{{ output_dir }}"
    #     state: directory
    #     mode: "0755"
    #
    - name: Install the watcher as a quadlet
      when: use_quadlets | bool
      block:
        # A user unit of the same name would take precedence over the quadlet one
        - name: Remove the plain systemd unit
          ansible.builtin.file:
            path: "{{ ansible_env.HOME }}/.config/systemd/user/pytroll-watcher-fci.service"
            state: absent

        - name: Ensure Quadlet directory exists
          ansible.builtin.file:
            path: "/etc/containers/systemd/users/{{ user_id_result.stdout }}"
            state: directory
            mode: "0755"
          become: true

        - name: Create Quadlet network file
          ansible.builtin.copy:
            dest: "/etc/containers/systemd/users/{{ user_id_result.stdout }}/pytroll.network"
            content: |
              [Network]
              NetworkName=pytroll_network
              [Install]
              WantedBy=default.target
          become: true

        - name: Create Quadlet for Pytroll-watcher
          template:
            src: pytroll-watcher.container.j2
            dest: "/etc/containers/systemd/users/{{ user_id_result.stdout }}/pytroll-watcher-fci.container"
          register: quad_watcher
          become: true

    - name: Install the watcher as a plain systemd unit
      when: not (use_quadlets | bool)
      block:
        - name: Remove the quadlet files
          ansible.builtin.file:
            path: "/etc/containers/systemd/users/{{ user_id_result.stdout }}/{{ item }}"
            state: absent
          loop:
            - pytroll.network
            - pytroll-watcher-fci.container
          become: true

        - name: Ensure the systemd user unit directory exists
          ansible.builtin.file:
            path: "{{ ansible_env.HOME }}/.config/systemd/user"
            state: directory
            mode: "0755"

        - name: Create the systemd unit for Pytroll-watcher
          template:
            src: pytroll-watcher-fci.service.j2
            dest: "{{ ansible_env.HOME }}/.config/systemd/user/pytroll-watcher-fci.service"
          register: watcher_unit

    - name: Ensure the latest image is present
      containers.podman.podman_image:
        name: "{{ docker_repo }}{{ item }}"
        force: yes # This forces a pull even if the tag is already present
      loop:
        - "{{ watcher_image }}"
      register: image_pull

    - name: Reload systemd to apply changes
      systemd:
        scope: user
        daemon_reload: yes
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ user_id_result.stdout }}"

    - name: Restart the services whose image, unit or configuration changed
      ansible.builtin.systemd:
        scope: user
        name: "{{ item.name }}.service"
        state: restarted
      loop:
        - name: pytroll-watcher-fci
          image: "{{ watcher_image }}"
          unit_changed: "{{ quad_watcher.changed or watcher_unit.changed }}"
      loop_control:
        label: "{{ item.name }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ user_id_result.stdout }}"
      when: >-
        item.unit_changed | bool
        or git_config_results.changed
        or (image_pull.results | selectattr('item', 'equalto', item.image) | selectattr('changed') | list | length > 0)

    - name: Ensure services are enabled and running
      ansible.builtin.systemd:
        scope: user
        name: "{{ item }}.service"
        state: started
        enabled: yes
      loop: "{{ (['pytroll-network'] if use_quadlets | bool else []) + ['pytroll-watcher-fci'] }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ user_id_result.stdout }}"
