---
# The main FCI stack: the segment gatherer (shared by every stack on the host)
# and the trollflow2 instance producing the standard product list.
- name: Setup the FCI processing stack
  hosts: all
  vars_files:
    - vars.yaml

  vars:
    output_dir: "{{ stack_outputs.main.dir }}"
    output_mount: "{{ stack_outputs.main.mount }}"
    manage_segment_gatherer_config: true
    quadlets:
      - name: segment-gatherer-fci
        description: Segment Gatherer Service
        image: "{{ segment_gatherer_image }}"
        volumes:
          - "{{ install_dir }}/config_fci_nc/:/config/:z"
        userns: keep-id

      - name: trollflow2-fci
        description: Trollflow2 Service
        image: "{{ trollflow2_image }}"
        volumes: "{{ trollflow2_volumes }}"
        extra_volumes: "{{ extra_trollflow2_volumes | default([]) }}"
        environment: "{{ trollflow2_environment }}"
        user: 0

  tasks:
    - name: Prepare the host
      ansible.builtin.include_tasks: tasks/base.yaml

    - name: Install the configuration
      ansible.builtin.include_tasks: tasks/config.yaml

    - name: Deploy the quadlets
      ansible.builtin.include_tasks: tasks/quadlets.yaml
