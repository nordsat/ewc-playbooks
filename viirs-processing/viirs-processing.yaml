---
- name: Setup Rootless Pytroll Stack for VIIRS
  hosts: all
  vars_files:
    - vars.yaml

  tasks:
    - name: Check if user lingering is enabled
      ansible.builtin.stat:
        path: "/var/lib/systemd/linger/{{ ansible_user_id }}"
      register: user_lingering

    - name: Enable lingering for service user
      become: true
      ansible.builtin.command:
        cmd: "loginctl enable-linger {{ ansible_user_id }}"
      changed_when: false

    - name: Install the latest version of podman
      package:
        name: podman
        state: latest
      become: true
      when: (ignore_packages is not defined or not (ignore_packages | bool))

    - name: show podman version
      shell: podman --version

    - name: bug fix for ubuntu 22 https://bugs.launchpad.net/ubuntu/+source/libpod/+bug/2024394
      shell: curl -O http://archive.ubuntu.com/ubuntu/pool/universe/g/golang-github-containernetworking-plugins/containernetworking-plugins_1.1.1+ds1-3build1_amd64.deb
      when: ansible_distribution == 'Ubuntu' and ansible_distribution_version == '22.04'

    - name: bug fix for ubuntu 22 https://bugs.launchpad.net/ubuntu/+source/libpod/+bug/2024394 part 2
      shell: dpkg -i containernetworking-plugins_1.1.1+ds1-3build1_amd64.deb
      when: ansible_distribution == 'Ubuntu' and ansible_distribution_version == '22.04'

    - name: Install the latest version of cron
      package:
        name: cron
        state: latest
      become: true
      when: (ignore_packages is not defined or not (ignore_packages | bool))

    - name: Install the latest version of aardvark-dns
      package:
        name: aardvark-dns
        state: latest
      become: true
      when: ansible_distribution == 'Ubuntu' and ansible_distribution_version >= '24.04'

    - name: Install the latest version of uidmap
      package:
        name: uidmap
        state: latest
      become: true
      when: (ignore_packages is not defined or not (ignore_packages | bool)) and (ansible_distribution == 'Ubuntu' and ansible_distribution_version >= '22.04')

    - name: Install the latest version of slirp4netns
      package:
        name: slirp4netns
        state: latest
      become: true
      when: (ignore_packages is not defined or not (ignore_packages | bool))

    - name: Get UID of the become user
      ansible.builtin.command: id -u
      register: user_id_result
      changed_when: false

    - name: Update the trollflow2 configuration
      git:
        repo: "{{ config_repo }}"
        dest: "{{ install_dir }}"
      register: git_config_results
      failed_when:
        - git_config_results.failed
        - not 'Local modifications exist in repository' in git_config_results.msg

    - name: Create local pyspectral directory
      file:
        path: "{{ install_dir }}/local/"
        state: directory
        mode: "0777"

    - name: install the segment-gatherer configuration
      template:
        src: segment_gatherer.yaml.j2
        dest: "{{ install_dir }}/config_viirs_h5/segment_gatherer.yaml"
      register: segment_gatherer_config_results

    - name: copy the environment configuration
      copy:
        src: env-variables
        dest: "{{ install_dir }}/config_viirs_h5"
      register: environment_config_results

    - name: Ensure output directory exists
      ansible.builtin.file:
        path: "{{ output_dir }}"
        state: directory
        mode: "0777"
      become: true

    # The input files now stay on the EUMETCast host, and the output directory is
    # cleaned by clean-viirs.sh from viirs-wms, which also removes the database rows
    - name: Remove the old cleaning of input and output directories
      ansible.builtin.cron:
        name: "{{ item }}"
        state: absent
      loop:
        - "Clean up input data directory"
        - "Clean up output data directory"

    - name: Ensure Quadlet directory exists
      ansible.builtin.file:
        path: "/etc/containers/systemd/users/{{ user_id_result.stdout }}"
        state: directory
        mode: "0755"
      become: true

    - name: Create Quadlet network file
      ansible.builtin.copy:
        dest: "/etc/containers/systemd/users/{{ user_id_result.stdout }}/pytroll.network"
        content: |
          [Network]
          NetworkName=pytroll_network
          [Install]
          WantedBy=default.target
      register: network_file
      become: true

    # Replaced by the pytroll-watcher-viirs on the EUMETCast host
    - name: Remove the Trollstalker Quadlet
      ansible.builtin.file:
        path: "/etc/containers/systemd/users/{{ user_id_result.stdout }}/trollstalker-viirs.container"
        state: absent
      register: quad_trollstalker
      become: true

    - name: Create Quadlet for Segment-gatherer
      template:
        src: segment-gatherer.container.j2
        dest: "/etc/containers/systemd/users/{{ user_id_result.stdout }}/segment-gatherer-viirs.container"
      register: quad_segment_gatherer
      become: true

    - name: Create Quadlet for Trollflow2
      template:
        src: trollflow2.container.j2
        dest: "/etc/containers/systemd/users/{{ user_id_result.stdout }}/trollflow2-viirs.container"
      register: quad_trollflow
      become: true

    - name: Ensure the latest image is present
      containers.podman.podman_image:
        name: "{{ docker_repo }}{{ item }}"
        force: yes # This forces a pull even if the tag is already present
      loop:
        - "{{ segment_gatherer_image }}"
        - "{{ trollflow2_image }}"
      register: image_pull

    - name: Reload systemd to apply changes
      systemd:
        scope: user
        daemon_reload: yes
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ user_id_result.stdout }}"
      when: network_file.changed or quad_trollstalker.changed or quad_segment_gatherer.changed or quad_trollflow.changed

    - name: Restart the services whose image, unit or configuration changed
      ansible.builtin.systemd:
        scope: user
        name: "{{ item.name }}.service"
        state: restarted
      loop:
        - name: segment-gatherer-viirs
          image: "{{ segment_gatherer_image }}"
          changed: "{{ quad_segment_gatherer.changed or segment_gatherer_config_results.changed }}"
        - name: trollflow2-viirs
          image: "{{ trollflow2_image }}"
          changed: "{{ quad_trollflow.changed or git_config_results.changed or environment_config_results.changed }}"
      loop_control:
        label: "{{ item.name }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ user_id_result.stdout }}"
      when: >-
        item.changed | bool
        or (image_pull.results | selectattr('item', 'equalto', item.image) | selectattr('changed') | list | length > 0)

    - name: Ensure services are enabled and running
      ansible.builtin.systemd:
        scope: user
        name: "{{ item }}.service"
        state: started
        enabled: yes
      loop:
        - pytroll-network
        - segment-gatherer-viirs
        - trollflow2-viirs
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ user_id_result.stdout }}"
